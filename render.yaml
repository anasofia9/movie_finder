services:
  - type: web
    name: nyc-movie-finder
    env: python
    buildCommand: ./build.sh
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: /opt/render/project/.cache/ms-playwright
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}NYC Movie Finder{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poiret+One&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0d0c0a;
            --panel: #161511;
            --panel-2: #12110e;
            --border: #292620;
            --text: #ece7dc;
            --muted: #97907f;
            --faint: #6e6858;
            --gold: #d4a94e;
            --gold-dim: rgba(212, 169, 78, 0.35);
            --green: #7dc98f;
            --serif: 'Poiret One', sans-serif;
            --sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        * { box-sizing: border-box; }

        body {
            font-family: var(--sans);
            max-width: 1220px;
            margin: 0 auto;
            padding: 48px 32px 32px;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.5;
            font-size: 15px;
        }

        a { color: inherit; }

        /* ------------------------------------------------------------------ */
        /* Header                                                              */
        /* ------------------------------------------------------------------ */
        .masthead {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 40px;
            margin-bottom: 28px;
        }

        .eyebrow {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 18px;
        }

        .eyebrow .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--green);
            flex-shrink: 0;
        }

        .masthead h1 {
            text-transform: uppercase;
            letter-spacing: 2px;
            font-family: var(--serif);
            font-weight: 400;
            font-size: 58px;
            line-height: 1;
            margin: 0 0 18px;
            letter-spacing: 0.5px;
        }

        .masthead .lede {
            margin: 0;
            color: var(--muted);
            font-size: 16px;
            max-width: 620px;
        }

        .journal-card {
            flex-shrink: 0;
            width: 260px;
            border: 1px solid var(--gold-dim);
            border-radius: 12px;
            padding: 18px 20px;
            background: linear-gradient(160deg, rgba(212,169,78,0.05), transparent 60%);
        }

        .journal-card .kicker {
            font-size: 10px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--gold);
            margin-bottom: 8px;
        }

        .journal-card h2 {
            font-family: var(--serif);
            font-weight: 400;
            font-size: 22px;
            margin: 0 0 8px;
        }

        .journal-card p {
            margin: 0 0 12px;
            font-size: 12.5px;
            color: var(--muted);
        }

        .journal-card a {
            font-size: 12.5px;
            font-weight: 600;
            color: var(--gold);
            text-decoration: none;
        }

        .journal-card a:hover { text-decoration: underline; }

        .rule {
            border: none;
            border-top: 1px solid var(--border);
            margin: 26px 0;
        }

        /* ------------------------------------------------------------------ */
        /* Venue chips                                                         */
        /* ------------------------------------------------------------------ */
        .venues-head {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 12px;
        }

        .venues-head .label {
            font-size: 11px;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: var(--muted);
        }

        .venues-head .links {
            display: flex;
            gap: 18px;
        }

        .venues-head button {
            background: none;
            border: none;
            padding: 0;
            font-family: var(--sans);
            font-size: 12px;
            font-weight: 600;
            color: var(--muted);
            text-decoration: underline;
            cursor: pointer;
        }

        .venues-head button:hover { color: var(--text); }

        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 26px;
        }

        .chip {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 7px 15px;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: transparent;
            font-family: var(--sans);
            font-size: 13px;
            color: var(--faint);
            cursor: pointer;
            transition: border-color .15s, color .15s;
        }

        .chip .chip-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--faint);
            transition: background .15s;
        }

        .chip.on {
            border-color: var(--gold-dim);
            color: var(--text);
        }

        .chip.on .chip-dot { background: var(--gold); }

        .chip:hover { border-color: var(--gold-dim); }

        /* ------------------------------------------------------------------ */
        /* Filter panel                                                        */
        /* ------------------------------------------------------------------ */
        .filter-panel {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-end;
            gap: 22px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 20px 22px;
        }

        .filter-group { display: flex; flex-direction: column; gap: 8px; }

        .filter-group label {
            font-size: 10px;
            letter-spacing: 1.4px;
            text-transform: uppercase;
            color: var(--muted);
        }

        .filter-group select,
        .filter-group input[type="date"] {
            background: var(--panel-2);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-family: var(--sans);
            font-size: 13.5px;
            padding: 9px 12px;
            min-width: 160px;
            color-scheme: dark;
        }

        .filter-group select:focus,
        .filter-group input:focus { outline: 1px solid var(--gold-dim); }

        .combo { position: relative; }

        .combo-input {
            background: var(--panel-2);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-family: var(--sans);
            font-size: 13.5px;
            padding: 9px 30px 9px 12px;
            min-width: 160px;
            width: 100%;
        }

        .combo-input::placeholder { color: var(--text); opacity: 0.9; }

        .combo-input:focus { outline: 1px solid var(--gold-dim); }

        .combo-clear {
            position: absolute;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--faint);
            font-size: 15px;
            cursor: pointer;
            padding: 2px 6px;
            display: none;
        }

        .combo.has-value .combo-clear { display: block; }

        .combo-clear:hover { color: var(--text); }

        .combo-list {
            display: none;
            position: absolute;
            top: calc(100% + 5px);
            left: 0;
            min-width: 100%;
            max-height: 230px;
            overflow-y: auto;
            background: var(--panel-2);
            border: 1px solid var(--border);
            border-radius: 8px;
            z-index: 30;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.55);
        }

        .combo.open .combo-list { display: block; }

        .combo-item {
            padding: 8px 12px;
            font-size: 13px;
            color: var(--muted);
            cursor: pointer;
            white-space: nowrap;
        }

        .combo-item:hover {
            background: rgba(212, 169, 78, 0.1);
            color: var(--text);
        }

        .rating-group { min-width: 220px; }

        .rating-group .rating-head {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }

        .rating-group .rating-value {
            font-size: 12.5px;
            font-weight: 600;
            color: var(--gold);
        }

        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 3px;
            border-radius: 2px;
            background: var(--border);
            margin: 12px 0 8px;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: var(--gold);
            cursor: pointer;
        }

        input[type="range"]::-moz-range-thumb {
            width: 15px;
            height: 15px;
            border: none;
            border-radius: 50%;
            background: var(--gold);
            cursor: pointer;
        }

        .btn-refresh {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--gold);
            color: #1a1508;
            border: none;
            border-radius: 9px;
            padding: 11px 20px;
            font-family: var(--sans);
            font-size: 13.5px;
            font-weight: 600;
            cursor: pointer;
            margin-left: auto;
        }

        .btn-refresh:hover { background: #e0b95e; }

        .panel-foot {
            display: flex;
            justify-content: flex-end;
            margin-top: 10px;
        }

        .panel-foot label {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            font-size: 12px;
            color: var(--faint);
            cursor: pointer;
        }

        .panel-foot input { accent-color: var(--gold); }

        /* ------------------------------------------------------------------ */
        /* Status                                                              */
        /* ------------------------------------------------------------------ */
        .status {
            margin: 22px 0 6px;
            font-size: 12.5px;
            color: var(--faint);
        }

        .status.loading {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            color: var(--muted);
        }

        .status-header { font-size: 14px; margin-bottom: 10px; }

        .status-log {
            max-height: 180px;
            overflow-y: auto;
            text-align: left;
            background: var(--panel-2);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 14px;
            margin-top: 10px;
            font-size: 12px;
            color: var(--muted);
        }

        .status-message { padding: 1.5px 0; }

        .status-details summary {
            cursor: pointer;
            color: var(--faint);
        }

        .data-notice { color: var(--gold); }

        .spinner {
            border: 3px solid var(--border);
            border-top: 3px solid var(--gold);
            border-radius: 50%;
            width: 34px;
            height: 34px;
            animation: spin 1s linear infinite;
            margin: 0 auto 14px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* ------------------------------------------------------------------ */
        /* Sections + cards                                                    */
        /* ------------------------------------------------------------------ */
        .sec { margin-top: 44px; }

        .sec-head {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 20px;
            margin-bottom: 22px;
        }

        .sec-head h2 {
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 27px;
            font-family: var(--serif);
            font-weight: 400;
            font-size: 34px;
            margin: 0;
        }

        .sec-head h2 .sec-note {
            font-family: var(--sans);
            font-size: 13px;
            color: var(--faint);
            margin-left: 10px;
        }

        .match-count {
            font-size: 12.5px;
            color: var(--faint);
            white-space: nowrap;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
            gap: 20px;
        }

        .card {
            display: flex;
            flex-direction: column;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
        }

        /* Metallic header tones */
        .m-0 { --m-bg: #262013; --m-ac: #d4a94e; }  /* brass */
        .m-1 { --m-bg: #271b12; --m-ac: #c98a63; }  /* copper */
        .m-2 { --m-bg: #161e27; --m-ac: #8badc9; }  /* steel */
        .m-3 { --m-bg: #142420; --m-ac: #74b295; }  /* verdigris */
        .m-4 { --m-bg: #201f26; --m-ac: #b2b2c4; }  /* pewter */
        .m-5 { --m-bg: #271a1d; --m-ac: #cf9288; }  /* rose gold */
        .m-6 { --m-bg: #181d20; --m-ac: #93a4ad; }  /* gunmetal */
        .m-7 { --m-bg: #231c10; --m-ac: #bd9a60; }  /* bronze */

        .card-head {
            background: var(--m-bg, var(--panel-2));
            border-bottom: 1px solid var(--border);
            padding: 16px 20px 18px;
        }

        .card-head-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .rate-badge {
            display: inline-block;
            padding: 3px 9px;
            border: 1px solid var(--gold-dim);
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.3);
            font-size: 12.5px;
            font-weight: 600;
            color: var(--gold);
        }

        .rate-badge.quiet {
            border-color: var(--border);
            color: var(--muted);
            font-weight: 500;
        }

        .head-label {
            font-size: 9.5px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--faint);
        }

        .card-title {
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-size: 24px;
            font-family: var(--serif);
            font-weight: 400;
            font-size: 29px;
            line-height: 1.08;
            margin: 0;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .title-rule {
            width: 44px;
            height: 2px;
            background: var(--m-ac, var(--gold));
            margin-top: 13px;
        }

        .director {
            font-size: 12.5px;
            color: var(--muted);
            margin-top: 10px;
        }

        .when-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .when-times {
            margin-top: 4px;
            padding-left: 21px;
            color: var(--text);
            opacity: 0.85;
            font-size: 12.5px;
        }

        .card-body {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 15px 20px 17px;
            flex-grow: 1;
        }

        .tags { display: flex; flex-wrap: wrap; gap: 6px; }

        .tag {
            padding: 2.5px 9px;
            background: var(--panel-2);
            border: 1px solid var(--border);
            border-radius: 5px;
            font-size: 11px;
            color: var(--muted);
        }

        .venue-line {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13.5px;
            font-weight: 500;
        }

        .venue-line .v-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--m-ac, var(--gold));
            flex-shrink: 0;
        }

        .when {
            display: block;
            background: var(--panel-2);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 9px 12px;
            font-size: 12.5px;
            color: var(--muted);
            margin-top: auto;
        }

        .card-foot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border);
            padding: 12px 20px;
        }

        .card-foot a {
            font-size: 12.5px;
            font-weight: 600;
            text-decoration: none;
        }

        .card-foot .lb-link { color: var(--gold); }
        .card-foot .lb-link:hover { text-decoration: underline; }
        .card-foot .venue-link { color: var(--muted); }
        .card-foot .venue-link:hover { color: var(--text); }
        .card-foot .no-link { font-size: 12.5px; color: var(--faint); }

        .card.dimmed { opacity: 0.75; }

        .empty-note { color: var(--faint); font-size: 13.5px; }

        /* ------------------------------------------------------------------ */
        /* Loading goose                                                       */
        /* ------------------------------------------------------------------ */
        .loading-section, .loading {
            text-align: center;
            padding: 40px 20px;
            color: var(--muted);
        }

        .goose-container {
            height: 130px;
            width: 100%;
            position: relative;
            overflow: hidden;
            margin: 10px 0;
        }

        .goose {
            max-width: 100px;
            position: absolute;
            bottom: 10px;
            left: -60px;
            filter: brightness(0) saturate(100%) invert(72%) sepia(38%) saturate(551%) hue-rotate(1deg) brightness(95%) contrast(88%);
            animation: gooseWalk 14s linear infinite;
        }

        @keyframes gooseWalk {
            0%   { left: -110px; transform: scaleX(-1); }
            45%  { left: calc(100% + 10px); transform: scaleX(-1); }
            50%  { left: calc(100% + 10px); transform: scaleX(1); }
            95%  { left: -110px; transform: scaleX(1); }
            100% { left: -110px; transform: scaleX(-1); }
        }

        /* ------------------------------------------------------------------ */
        /* Footer                                                              */
        /* ------------------------------------------------------------------ */
        .site-foot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-top: 56px;
            padding-top: 22px;
            border-top: 1px solid var(--border);
            font-size: 12px;
            color: var(--faint);
        }

        .site-foot a { color: var(--muted); }

        @media (max-width: 900px) {
            body { padding: 28px 16px; }
            .masthead { flex-direction: column; gap: 24px; }
            .masthead h1 {
            text-transform: uppercase;
            letter-spacing: 2px; font-size: 42px; }
            .journal-card { width: 100%; }
            .btn-refresh { margin-left: 0; width: 100%; justify-content: center; }
            .filter-group select, .filter-group input[type="date"] { min-width: 130px; }
        }
    </style>
</head>
<body>
    {% block content %}{% endblock %}

    <footer class="site-foot">
        <span>© 2026 NYC Movie Finder. Not affiliated with Letterboxd or its associated platforms.</span>
        <a href="/newsletter">Weekly journal →</a>
    </footer>

    <script>
        let statusInterval = null;
        let wasScraping = false;

        /* ------------------------- venue chips ------------------------- */
        function toggleChip(el) {
            el.classList.toggle('on');
            applyFilters();
        }

        function setAllVenues(on) {
            document.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', on));
            applyFilters();
        }

        function getSelectedTheaters() {
            return Array.from(document.querySelectorAll('.chip.on')).map(c => c.dataset.id);
        }

        /* ----------------------- combo (searchable) ---------------------- */
        function comboInput(input) {
            const combo = input.closest('.combo');
            combo.classList.add('open');
            combo.classList.toggle('has-value', !!input.value);
            const q = input.value.toLowerCase();
            let any = false;
            combo.querySelectorAll('.combo-item').forEach(item => {
                const show = !q || item.textContent.toLowerCase().includes(q);
                item.style.display = show ? '' : 'none';
                any = any || show;
            });
            combo.classList.toggle('open', any);
            applyFilters();
        }

        function comboOpen(input) {
            comboInput(input);
        }

        function comboClose(input) {
            // Delay so a mousedown on an item lands first
            setTimeout(() => input.closest('.combo').classList.remove('open'), 120);
        }

        function comboPick(item) {
            const combo = item.closest('.combo');
            const input = combo.querySelector('.combo-input');
            input.value = item.textContent.trim();
            combo.classList.remove('open');
            combo.classList.add('has-value');
            applyFilters();
        }

        function comboClear(inputId) {
            const input = document.getElementById(inputId);
            const combo = input.closest('.combo');
            input.value = '';
            combo.classList.remove('open', 'has-value');
            applyFilters();
        }

        /* --------------------------- filters --------------------------- */
        function clearDateFilter() {
            const from = document.getElementById('dateFrom');
            const to = document.getElementById('dateTo');
            if (from) from.value = '';
            if (to) to.value = '';
            applyFilters();
        }

        function applyFilters() {
            const chips = Array.from(document.querySelectorAll('.chip'));
            const selectedVenues = new Set(chips.filter(c => c.classList.contains('on')).map(c => c.dataset.id));
            const venueFilterActive = chips.length > 0 && selectedVenues.size < chips.length;

            const genre = (document.getElementById('genreSearch')?.value || '').trim().toLowerCase();
            const director = (document.getElementById('directorSearch')?.value || '').trim().toLowerCase();

            const fromVal = document.getElementById('dateFrom')?.value || '';
            const toVal = document.getElementById('dateTo')?.value || '';
            const dateFilterActive = !!(fromVal || toVal);

            const slider = document.getElementById('ratingSlider');
            const minRating = slider ? parseFloat(slider.value) : 0;

            const now = new Date();
            const today = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;

            document.querySelectorAll('.card[data-theaters]').forEach(card => {
                let visible = true;
                if (venueFilterActive) {
                    const theaters = (card.dataset.theaters || '').split('|').filter(t => t);
                    visible = theaters.some(t => selectedVenues.has(t));
                }
                if (visible && genre) {
                    // Substring match so partial typing filters live
                    visible = (card.dataset.genres || '').toLowerCase().includes(genre);
                }
                if (visible && director) {
                    visible = (card.dataset.director || '').toLowerCase().includes(director);
                }
                if (visible && dateFilterActive) {
                    const dates = (card.dataset.dates || '').split(',').filter(d => d);
                    const inRange = d => (!fromVal || d >= fromVal) && (!toVal || d <= toVal);
                    // Movies without listed dates are assumed to be showing today
                    visible = dates.length ? dates.some(inRange) : inRange(today);
                }
                if (visible && card.dataset.rating) {
                    visible = parseFloat(card.dataset.rating) >= minRating;
                }
                card.style.display = visible ? '' : 'none';
            });

            // Per-section match counts + slider labels
            document.querySelectorAll('.sec').forEach(sec => {
                const count = sec.querySelectorAll('.card[data-theaters]:not([style*="none"])').length;
                const counter = sec.querySelector('.match-count');
                if (counter) counter.textContent = `Showing ${count} match${count === 1 ? '' : 'es'}`;
            });
            const label = document.getElementById('ratingValue');
            if (label && slider) label.textContent = `${parseFloat(slider.value).toFixed(1)}★ or higher`;
            const note = document.getElementById('highRatedNote');
            if (note && slider) note.textContent = `(Rated ${parseFloat(slider.value).toFixed(1)}★+ by Letterboxd users)`;
        }

        /* --------------------------- refresh ---------------------------- */
        function refreshData() {
            const theaters = getSelectedTheaters();
            if (theaters.length === 0) {
                alert('Select at least one venue to scrape.');
                return;
            }
            const slider = document.getElementById('ratingSlider');
            const payload = {
                theaters: theaters,
                rating_threshold: slider ? parseFloat(slider.value) : 4.0,
                disable_cache: document.getElementById('forceFresh')?.checked || false
            };

            fetch('/api/refresh', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(r => r.json())
            .then(data => {
                if (data.status === 'started' || data.status === 'already_running') {
                    const results = document.getElementById('results');
                    if (results) results.style.display = 'none';
                    const loading = document.getElementById('scrape-loading');
                    if (loading) loading.style.display = '';
                    wasScraping = true;
                    updateStatus();
                    if (!statusInterval) statusInterval = setInterval(updateStatus, 5000);
                }
            })
            .catch(() => alert('Could not start the refresh — is the server running?'));
        }

        /* ---------------------------- status ---------------------------- */
        function updateStatus() {
            fetch('/api/status')
                .then(r => r.json())
                .then(data => {
                    const statusDiv = document.getElementById('status');
                    if (!statusDiv) return;

                    if (data.is_scraping) {
                        wasScraping = true;
                        statusDiv.className = 'status loading';
                        let html = '<div class="spinner"></div><div class="status-header">Scraping movie data… this may take a few minutes.</div>';
                        if (data.status_messages && data.status_messages.length) {
                            html += '<div class="status-log">';
                            data.status_messages.forEach(m => { html += `<div class="status-message">${m}</div>`; });
                            html += '</div>';
                        }
                        statusDiv.innerHTML = html;
                        const log = statusDiv.querySelector('.status-log');
                        if (log) log.scrollTop = log.scrollHeight;
                        if (!statusInterval) statusInterval = setInterval(updateStatus, 5000);
                    } else {
                        if (wasScraping) { wasScraping = false; location.reload(); return; }
                        if (statusInterval) { clearInterval(statusInterval); statusInterval = null; }
                    }
                })
                .catch(() => {});
        }

        document.addEventListener('DOMContentLoaded', () => {
            applyFilters();
            const scrapingNow = document.getElementById('scrape-loading') && document.getElementById('scrape-loading').style.display !== 'none';
            if (scrapingNow) {
                wasScraping = true;
                statusInterval = setInterval(updateStatus, 5000);
            }
            updateStatus();
        });
    </script>
</body>
</html>
